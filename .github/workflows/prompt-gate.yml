name: Prompt gate
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run gate
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PW_RUNS: "10"
          PW_BASE_REF: origin/${{ github.base_ref }}
        run: node gate.js
        continue-on-error: true
      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.existsSync("gate-comment.md")
              ? fs.readFileSync("gate-comment.md", "utf8")
              : "Prompt Whisperer gate did not produce a report.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Fail if regression confirmed
        if: steps.gate.outcome == 'failure'
        run: exit 1
